<!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<div class="p-4">
  <h2 class="h4 fw-bold text-primary mb-3">
    <i class="bi bi-journal-bookmark-fill me-2"></i>Liste des Réservations
  </h2>

  <ul class="list-unstyled">
    <li *ngFor="let r of reservations" class="mb-3">
      <div class="card shadow-sm border-0">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1 text-dark">{{ r.nom }}</h5>
            <p class="card-text mb-0">
              <i class="bi bi-geo-alt-fill text-danger me-1"></i>{{ r.destination }}
            </p>
            <small class="text-muted">
              <i class="bi bi-calendar2-event me-1"></i>{{ r.date }}
            </small>
          </div>
          <button (click)="delete(r.id!)" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-x-circle-fill me-1"></i>Annuler
          </button>
        </div>
      </div>
    </li>
  </ul>
</div>
