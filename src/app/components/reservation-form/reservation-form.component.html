<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

<form (ngSubmit)="onSubmit()" class="p-4 rounded shadow bg-light needs-validation" novalidate>
  <h2 class="mb-4 text-center fw-bold text-primary">Réservation de voyage ✈️</h2>

  <div class="mb-3">
    <label for="nom" class="form-label">Nom complet</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
      <input type="text" [(ngModel)]="reservation.nom" name="nom" id="nom" class="form-control" placeholder="Votre nom" required />
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Adresse email</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
      <input type="email" [(ngModel)]="reservation.email" name="email" id="email" class="form-control" placeholder="nom@example.com" required />
    </div>
  </div>

  <div class="mb-3">
    <label for="date" class="form-label">Date de départ</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-calendar-event-fill"></i></span>
      <input type="date" [(ngModel)]="reservation.date" name="date" id="date" class="form-control" required />
    </div>
  </div>

  <div class="mb-4">
    <label for="destination" class="form-label">Destination</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-geo-alt-fill"></i></span>
      <input type="text" [(ngModel)]="reservation.destination" name="destination" id="destination" class="form-control" placeholder="Votre Destination" required />
    </div>
  </div>

  <div class="d-grid">
    <button type="submit" class="btn btn-primary btn-lg shadow-sm">
      <i class="bi bi-check-circle-fill me-2"></i>Réserver maintenant
    </button>
  </div>
</form>
